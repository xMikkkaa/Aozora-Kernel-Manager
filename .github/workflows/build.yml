name: Build CI

on:
  push:
    branches:
      - kotlin
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/icon/**'
  pull_request:
    branches:
      - kotlin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Domains
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Changes Per Domain
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'app/src/main/rust/**'
            android:
              - 'app/src/main/kotlin/**'
              - 'app/src/main/res/**'
              - '*.gradle.kts'
              - '**/*.gradle.kts'
              - 'gradle/**'

  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust + NDK
        uses: ./.github/actions/setup-rust-ndk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Report APK Size
        run: |
          APK="$(ls app/build/outputs/apk/*/app-*.apk | head -n 1)"
          SIZE_BYTES="$(stat -c%s "$APK")"
          SIZE_HR="$(du -h "$APK" | cut -f1)"
          {
            echo "### APK Size"
            echo ""
            echo "| File | Size | Bytes |"
            echo "| ---- | ---- | ----- |"
            echo "| \`$APK\` | $SIZE_HR | $SIZE_BYTES |"
          } >> "$GITHUB_STEP_SUMMARY"
          LIMIT=$((50 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$LIMIT" ]; then
            echo "::warning::APK size $SIZE_HR exceeds the 50MB budget"
          else
            echo "APK size $SIZE_HR is within the 50MB budget"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aozora-Manager-APK
          path: app/build/outputs/apk/*/app-*.apk
          retention-days: 14
