name: Build CI

on:
  push:
    branches:
      - kotlin
      - dev
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/icon/**'
  pull_request:
    branches:
      - kotlin
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Detect Changed Domains
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
      skip_version_only: ${{ steps.version_check.outputs.skip_version_only }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if only version string changed
        id: version_check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
            if [ "$CHANGED" = "manager/app/build.gradle.kts" ]; then
              NON_VERSION=$(git diff HEAD^ HEAD -- manager/app/build.gradle.kts | \
                grep -E '^[+-]' | \
                grep -vE '^[+-]{3}' | \
                grep -vE 'versionCode|versionName' || true)
              if [ -z "$NON_VERSION" ]; then
                echo "skip_version_only=true" >> "$GITHUB_OUTPUT"
                echo "::notice::Version-only change detected, skipping CI"
                exit 0
              fi
            fi
          fi
          echo "skip_version_only=false" >> "$GITHUB_OUTPUT"

      - name: Detect Changes Per Domain
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'rust/**'
            android:
              - 'manager/app/src/main/kotlin/**'
              - 'manager/app/src/main/res/**'
              - '*.gradle.kts'
              - '**/*.gradle.kts'
              - 'gradle/**'

  check-green:
    name: Check if Commit Already Green
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check workflow run status for commit
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.pull_request.head.sha }}';
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              event: 'push',
              status: 'success'
            });
            const lintsRun = runs.data.workflow_runs.find(r =>
              r.name === 'Lints & Tests' && r.head_branch === 'dev'
            );
            const buildRun = runs.data.workflow_runs.find(r =>
              r.name === 'Build CI' && r.head_branch === 'dev'
            );
            const skip = lintsRun && buildRun ? 'true' : 'false';
            core.setOutput('skip', skip);

  build:
    needs: [changes, check-green]
    if: needs.changes.outputs.skip_version_only != 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.android == 'true') && (github.event_name != 'pull_request' || needs.check-green.outputs.skip != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust + NDK
        uses: ./.github/actions/setup-rust-ndk

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -z "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > manager/app/aozora.jks
            {
              echo "storeFile=manager/app/aozora.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > key.properties
          else
            echo "Error: KEYSTORE_BASE64 missing"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          ./gradlew assembleRelease -PciVersionSuffix=-${SHORT_HASH}

      - name: Report APK Size
        run: |
          APK="manager/app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES="$(stat -c%s "$APK")"
          SIZE_HR="$(du -h "$APK" | cut -f1)"
          {
            echo "### APK Info"
            echo ""
            echo "| File | Size | Bytes |"
            echo "| ---- | ---- | ----- |"
            echo "| \`$APK\` | $SIZE_HR | $SIZE_BYTES |"
          } >> "$GITHUB_STEP_SUMMARY"
          LIMIT=$((50 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$LIMIT" ]; then
            echo "::warning::APK size $SIZE_HR exceeds the 50MB budget"
          else
            echo "APK size $SIZE_HR is within the 50MB budget"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aozora-Manager-APK
          path: manager/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
