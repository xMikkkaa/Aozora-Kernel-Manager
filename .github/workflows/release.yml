name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for accurate changelog generation

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust + NDK
        uses: ./.github/actions/setup-rust-ndk

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -z "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/aozora.jks
            {
              echo "storeFile=app/aozora.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > key.properties
          else
            echo "Error: KEYSTORE_BASE64 missing. Refusing to create a release without proper signing key!"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Stage Fresh APK
        run: |
          mkdir -p app/release
          cp app/build/outputs/apk/release/app-release.apk app/release/app-release.apk

      - name: Verify APK Signature & Native Libs
        if: hashFiles('app/release/app-release.apk') != ''
        run: |
          APK="app/release/app-release.apk"
          APKSIGNER=""
          for f in "$ANDROID_HOME"/build-tools/*/apksigner; do
            if [ -x "$f" ]; then
              APKSIGNER="$f"
              break
            fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools. A runner with full Android SDK build-tools is required."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          echo "--- arm64-v8a libs in APK ---"
          unzip -l "$APK" | grep "lib/arm64-v8a/" || echo "(no arm64-v8a libs listed)"
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libnative\.so"; then
            echo "OK: lib/arm64-v8a/libnative.so present in $APK"
          else
            echo "::error::lib/arm64-v8a/libnative.so is missing from $APK"
            exit 1
          fi

      - name: Generate SBOM (APK)
        uses: anchore/sbom-action@v0
        with:
          path: app/release/app-release.apk
          format: spdx-json
          output-file: sbom-apk.spdx.json
          upload-artifact: false

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SBOM-${{ github.ref_name }}
          path: sbom-apk.spdx.json
          retention-days: 14

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the previous tag (looking before HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "Generating changelog..."
          if [ -z "$LAST_TAG" ]; then
            git log -n 10 --pretty=format:"* %s" > changelog.txt
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"* %s" > changelog.txt
          fi
          
          # Beautify common commit prefixes
          sed -i -E 's/\* (feat|Feat):/* ✨ Feature:/g' changelog.txt
          sed -i -E 's/\* (fix|Fix):/* 🐛 Fix:/g' changelog.txt
          sed -i -E 's/\* (docs|Docs):/* 📝 Docs:/g' changelog.txt
          sed -i -E 's/\* (chore|Chore):/* 🔧 Chore:/g' changelog.txt
          
          # Pass the changelog to GitHub Actions environment variable
          {
            echo 'CHANGELOG<<EOF'
            cat changelog.txt
            echo
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Aozora Manager ${{ github.ref_name }}
          body: |
            ### What's New in ${{ github.ref_name }}
            ${{ env.CHANGELOG }}
          files: app/release/app-release.apk
          draft: false
          prerelease: false

      - name: Write Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ runner.temp }}/firebase-sa.json"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ runner.temp }}/firebase-sa.json
          file: app/release/app-release.apk
          groups: internal-testers
          releaseNotes: ${{ env.CHANGELOG }}
