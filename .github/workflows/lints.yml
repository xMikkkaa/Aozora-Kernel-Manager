name: Lints & Tests

on:
  push:
    branches:
      - kotlin
  pull_request:
    branches:
      - kotlin

jobs:
  android-lint-and-test:
    name: Android Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src/main/rust/xaozora_jni
            app/src/main/rust/xaozora_daemon

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Dummy Keystore Config
        run: |
          echo "storeFile=app/dummy.jks" > key.properties
          echo "storePassword=dummy" >> key.properties
          echo "keyAlias=dummy" >> key.properties
          echo "keyPassword=dummy" >> key.properties
      
      - name: Run Android Lint
        run: ./gradlew lintDebug
      
      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest || true # Continue even if no tests exist yet
      
      - name: Upload Lint Report (If Failed)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Android-Lint-Report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  rust-lint-and-test:
    name: Rust Fmt, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src/main/rust/xaozora_jni
            app/src/main/rust/xaozora_daemon
      
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      
      - name: Check Rust JNI
        working-directory: app/src/main/rust/xaozora_jni
        run: |
          cargo fmt -- --check
          cargo ndk -t arm64-v8a clippy
          cargo test || true # Run tests if any exist
          
      - name: Check Rust Daemon (AUTD)
        working-directory: app/src/main/rust/xaozora_daemon
        run: |
          cargo fmt -- --check
          cargo ndk -t arm64-v8a clippy
          cargo test || true # Run tests if any exist
