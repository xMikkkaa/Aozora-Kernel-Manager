name: Lints & Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - kotlin
      - dev
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'assets/icon/**'
  pull_request:
    branches:
      - kotlin
      - dev

jobs:
  changes:
    name: Detect Changed Domains
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Changes Per Domain
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'rust/**'
            android:
              - 'manager/app/src/main/kotlin/**'
              - 'manager/app/src/main/res/**'
              - '*.gradle.kts'
              - '**/*.gradle.kts'
              - 'gradle/**'

  android-lint-and-test:
    name: Android Lint & Unit Tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust + NDK
        uses: ./.github/actions/setup-rust-ndk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      
      - name: Run Android Lint
        run: ./gradlew lintDebug
      
      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest
      
      - name: Upload Lint Report (If Failed)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Android-Lint-Report
          path: manager/app/build/reports/lint-results-debug.html
          retention-days: 7

  rust-lint-and-test:
    name: Rust Fmt, Clippy & Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Rust + NDK
        uses: ./.github/actions/setup-rust-ndk
        with:
          components: rustfmt, clippy
      
      - name: Check Rust JNI
        working-directory: rust/xaozora_jni
        run: |
          cargo fmt -- --check
          cargo ndk -t arm64-v8a clippy -- -D warnings
          cargo test
          
      - name: Check Rust Daemon (AUTD)
        working-directory: rust/xaozora_daemon
        run: |
          cargo fmt -- --check
          cargo ndk -t arm64-v8a clippy -- -D warnings
          cargo test
