name: Setup Rust + NDK
description: Single entry point for all Rust jobs — toolchain (aarch64-linux-android), shared rust-cache workspaces, cached cargo-ndk install.

inputs:
  targets:
    description: Rust targets to install
    required: false
    default: aarch64-linux-android
  components:
    description: Extra toolchain components (e.g. "rustfmt, clippy")
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          app/src/main/rust/xaozora_jni
          app/src/main/rust/xaozora_daemon

    - name: Install cargo-ndk (cached)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk
